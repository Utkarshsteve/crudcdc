name: publish
on:
  workflow_dispatch:           # run manually: publishes to TestPyPI
  release:
    types: [published]         # a GitHub release: publishes to PyPI
jobs:
  publish:
    runs-on: ubuntu-latest
    # Each environment needs a matching Trusted Publisher on (test.)pypi.org: no API tokens.
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      contents: read             # checkout of a private repo
      id-token: write            # Trusted Publishing
    env:
      UV_PUBLISH_URL: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish --trusted-publishing always
