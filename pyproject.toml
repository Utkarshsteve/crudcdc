[project]
name = "crudcdc"
version = "0.1.0"
description = "Async CRUD on SQLAlchemy with a built-in change data capture (CDC) feed that consumers can read."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Utkarsh", email = "utkarshsteve7@gmail.com" }]
requires-python = ">=3.11"
keywords = ["crud", "cdc", "change-data-capture", "outbox", "sqlalchemy", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["sqlalchemy[asyncio]>=2.1"]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.22"]
postgres = ["asyncpg>=0.31"]

[project.urls]
Repository = "https://github.com/Utkarshsteve/crudcdc"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "aiosqlite>=0.22", "ruff>=0.14", "mypy>=1.18"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
